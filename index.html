<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Dodge - Arcade Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="ui-header">
      <div class="score-board">PONTOS: <span id="score">0</span></div>
      <div class="lives-board">VIDAS: <span id="lives">3</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="startScreen" class="overlay">
      <h1>NEON DODGE</h1>
      <p>Desvie dos asteroides e colete os orbes energéticos!</p>
      <button id="startBtn">JOGAR</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="danger">GAME OVER</h1>
      <p>Pontuação final: <span id="finalScore">0</span></p>
      <button id="restartBtn">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
